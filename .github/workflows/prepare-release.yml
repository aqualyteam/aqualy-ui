name: Prepare unpublished npm candidate
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed public main commit (40 hex characters)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-candidate-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'aqualyteam/aqualy-ui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      AQUALY_BROWSER_CHANNEL: chrome
      AQUALY_EXPECTED_SOURCE: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; node24
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; node24
        with:
          version: 10.24.0
          cache: false
      - name: Check exact source before installation
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; assert.match(process.env.AQUALY_EXPECTED_SOURCE, /^[a-f0-9]{40}$/); assert.equal(process.env.AQUALY_EXPECTED_SOURCE, process.env.GITHUB_SHA);'
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:public
      - run: pnpm test
      - run: pnpm typecheck
      - name: Pack once and test the exact candidate
        run: pnpm prepare:release -- --output "$RUNNER_TEMP/aqualy-release-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; node24
        with:
          name: aqualy-ui-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/aqualy-release-candidate/
          retention-days: 30
          if-no-files-found: error
          overwrite: false
