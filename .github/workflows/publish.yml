name: Publish approved npm artifact (DISABLED)
on:
  workflow_dispatch:
    inputs:
      preparation_run:
        description: Successful prepare-release.yml run ID
        required: true
        type: string
      source_sha:
        description: Approved build source commit
        required: true
        type: string
      tarball_sha256:
        description: Approved exact archive SHA-256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publication-aqualy-ui
  cancel-in-progress: false
jobs:
  publish:
    # Hard latch: dispatch/inputs/secrets cannot enable this job in C1 preparation.
    # A separately reviewed publication authorization must change both this and release-policy.json.
    if: ${{ false }}
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AQUALY_PREPARATION_RUN: ${{ inputs.preparation_run }}
      AQUALY_RELEASE_SOURCE: ${{ inputs.source_sha }}
      AQUALY_RELEASE_SHA256: ${{ inputs.tarball_sha256 }}
    steps:
      - name: Initialize isolated artifact and npm paths
        run: |
          printf 'AQUALY_ARTIFACT_DIRECTORY=%s/approved-candidate\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'NPM_CONFIG_USERCONFIG=%s/anonymous.npmrc\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; node24
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; node24
        with:
          version: 10.24.0
          cache: false
      - name: Verify authorization and preparation run
        run: node scripts/verify-release-run.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2; node24
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preparation_run }}
          name: aqualy-ui-candidate-${{ inputs.source_sha }}
          path: ${{ env.AQUALY_ARTIFACT_DIRECTORY }}
      - name: Verify approved archive before registry write
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          node scripts/verify-candidate.mjs --authorized
      - name: Publish exact tarball with OIDC (future authorization only)
        run: node scripts/publish-release.mjs --oidc
      - name: Anonymous registry integrity and tag readback
        run: node scripts/verify-registry-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; node24
        if: always()
        with:
          name: npm-publication-readback
          path: ${{ env.AQUALY_ARTIFACT_DIRECTORY }}/registry-readback.json
          if-no-files-found: warn
          retention-days: 30
