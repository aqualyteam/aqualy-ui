name: MIT SDK validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: sdk-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      AQUALY_BROWSER_CHANNEL: chrome
      AQUALY_RELEASE_TEST_TARBALL: /tmp/aqualy-ui-registry-verified.tgz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; node24
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; node24
        with:
          version: 10.24.0
      - name: Runner toolchain
        run: |
          node --version
          pnpm --version
          google-chrome --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:public
      - name: Anonymous exact registry artifact
        run: node scripts/verify-registry-consumer.mjs --output "$AQUALY_RELEASE_TEST_TARBALL"
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm verify:release
      - name: Anonymous npm Next consumer and browser matrix
        run: |
          set -o pipefail
          node scripts/verify-c0-consumer.mjs --registry | tee /tmp/aqualy-ui-consumer-ci.log
      - name: Collect synthetic validation artifacts
        if: always()
        run: |
          mkdir -p test-results/consumer
          if [ -f /tmp/aqualy-ui-consumer-ci.log ]; then
            cp /tmp/aqualy-ui-consumer-ci.log test-results/consumer/consumer-ci.log
          fi
          for consumer_artifacts in /tmp/aqualy-c0-consumer-*/artifacts; do
            if [ -d "$consumer_artifacts" ]; then
              cp -R "$consumer_artifacts" "test-results/consumer/$(basename "$(dirname "$consumer_artifacts")")"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; node24
        if: always()
        with:
          name: public-sdk-validation
          path: test-results/consumer
          retention-days: 14
          if-no-files-found: error
